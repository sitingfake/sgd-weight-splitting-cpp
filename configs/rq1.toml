# Configuration for Research Question 1 (RQ1): Per-Update Cost Benchmarks
# Evaluates C++ Direct vs. C++ Scaled (w = s * v) vs. scikit-learn SGDRegressor.

[general]
alpha = 1e-4
loss = "squared_error"
penalty = "l2"
fit_intercept = false
intercept_decay = 1.0
schedule = "invscaling"
eta0 = 0.01
power_t = 0.25
epochs = 3
warmup = 1
repeats = 7
seed = 42

# Grid A: Varying dimension n (sparsity remains fixed at k=20, m=10,000)
[grid_a]
n = [1000, 10000, 100000, 1000000]
k = 20
m = 10000

# Grid B: Varying density via non-zeros k (n=5,000, m=5,000; density 0.1% to 100%)
[grid_b]
k = [5, 50, 500, 2500, 5000]
n = 5000
m = 5000

# Grid C: Varying sample count m (fixed dimension n=10,000, k=20)
[grid_c]
m = [1000, 10000, 100000, 1000000]
n = 10000
k = 20

# Quick/Smoke test configuration for RQ1 (scaled-down dimensions for fast execution)

[general]
alpha = 1e-4
loss = "squared_error"
penalty = "l2"
fit_intercept = false
intercept_decay = 1.0
schedule = "invscaling"
eta0 = 0.01
power_t = 0.25
epochs = 3
warmup = 1
repeats = 3
seed = 42

[grid_a]
n = [1000, 5000]
k = 10
m = 1000

[grid_b]
k = [5, 50, 200]
n = 500
m = 500

[grid_c]
m = [500, 2000]
n = 1000
k = 10
